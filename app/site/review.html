<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>End Session</title>
<!-- Tekken app page: runs scripts/session_review.py on this PC (POST /api/end-session)
     and shows the report. Only works through the app at localhost:8787. -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #141414; color: #e0e0e0; min-height: 100vh;
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }
  a { color: #8ab4ff; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .back { color: #888; text-decoration: none; font-size: 13px; }
  .back:hover { color: #ddd; }
  h1.page { font-size: 20px; font-weight: 700; }
  .controls { background: #1b1b1b; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px;
              display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; margin-bottom: 20px; }
  .group { display: flex; align-items: center; gap: 6px; }
  .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
  .opt { background: transparent; border: 1px solid #333; color: #888; border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .opt.active { background: #2e2e2e; border-color: #888; color: #fff; }
  .run { margin-left: auto; background: #e0e0e0; color: #111; border: 0; border-radius: 8px; padding: 9px 18px;
         font: inherit; font-weight: 700; cursor: pointer; }
  .run:disabled { opacity: .5; cursor: wait; }
  .status { font-size: 13px; color: #888; margin-bottom: 16px; min-height: 18px; }
  .status.err { color: #ff8a80; }
  .status li { list-style: none; }
  .status li::before { content: '✓ '; color: #3ddc84; }
  .report { background: #1b1b1b; border: 1px solid #2a2a2a; border-radius: 10px; padding: 20px 22px; line-height: 1.55; }
  .report h1 { font-size: 20px; margin-bottom: 4px; }
  .report h2 { font-size: 15px; margin: 22px 0 8px; color: #fff; }
  .report p { margin: 8px 0; color: #ccc; }
  .report ul { margin: 8px 0 8px 20px; color: #ccc; }
  .report table { border-collapse: collapse; width: 100%; margin: 8px 0; font-variant-numeric: tabular-nums; font-size: 13px; }
  .report th { text-align: left; color: #888; font-weight: 600; border-bottom: 1px solid #333; padding: 6px 8px; }
  .report td { border-bottom: 1px solid #222; padding: 6px 8px; }
  .report hr { border: 0; border-top: 1px solid #2a2a2a; margin: 20px 0 10px; }
  .report .foot { font-size: 12px; color: #666; }
  .empty { color: #666; }
  @media (max-width: 600px) { .run { margin-left: 0; width: 100%; } .report { padding: 14px; overflow-x: auto; } }
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <h1 class="page">End session</h1>
    <a class="back" href="/">← Stage tracker &amp; guides</a>
  </div>

  <div class="controls">
    <div class="group"><span class="label">Review</span>
      <button class="opt active" data-scope="last session">Last session</button>
      <button class="opt" data-scope="today">Today</button>
    </div>
    <div class="group"><span class="label">Games</span>
      <button class="opt active" data-mode="ranked">Ranked</button>
      <button class="opt" data-mode="all">All modes</button>
    </div>
    <button class="run" id="run">End session</button>
  </div>

  <div class="status" id="status"></div>
  <article class="report" id="report"><p class="empty">Loading your latest review…</p></article>
</div>

<script>
  const state = { scope: 'last session', mode: 'ranked' }
  const $ = id => document.getElementById(id)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

  // Just enough Markdown for the review: headings, tables, lists, bold, links, rules.
  function inline(t) {
    return esc(t)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
  }
  function md(text) {
    const lines = text.replace(/\r/g, '').split('\n'), out = []
    let i = 0, afterRule = false
    const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())
    while (i < lines.length) {
      const l = lines[i]
      if (!l.trim()) { i++; continue }
      let m
      if ((m = l.match(/^(#{1,3})\s+(.*)/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue }
      if (/^---+\s*$/.test(l)) { out.push('<hr>'); afterRule = true; i++; continue }
      if (l.trim().startsWith('|') && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1] || '')) {
        const head = cells(l); i += 2
        const rows = []
        while (i < lines.length && lines[i].trim().startsWith('|')) rows.push(cells(lines[i++]))
        out.push('<table><thead><tr>' + head.map(h => `<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>' +
          rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>')
        continue
      }
      if (/^\s*[-*]\s+/.test(l)) {
        const items = []
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, ''))
        out.push('<ul>' + items.map(x => `<li>${inline(x)}</li>`).join('') + '</ul>')
        continue
      }
      const para = []
      while (i < lines.length && lines[i].trim() && !/^(#|\||---|\s*[-*]\s)/.test(lines[i])) para.push(lines[i++])
      if (!para.length) para.push(lines[i++])
      out.push(`<p${afterRule ? ' class="foot"' : ''}>${inline(para.join(' '))}</p>`)
    }
    return out.join('\n')
  }

  function show(markdown) {
    $('report').innerHTML = markdown ? md(markdown) : '<p class="empty">No reviews yet. Press End session after you play.</p>'
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-scope], [data-mode]')
    if (!b) return
    const key = b.dataset.scope ? 'scope' : 'mode'
    state[key] = b.dataset[key]
    document.querySelectorAll(`[data-${key}]`).forEach(x => x.classList.toggle('active', x === b))
  })

  $('run').addEventListener('click', async () => {
    const btn = $('run'), status = $('status')
    btn.disabled = true
    status.className = 'status'
    status.textContent = 'Checking ewgf.gg for your last game and writing the review…'
    try {
      const r = await fetch('/api/end-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Tekken-App': '1' },
        body: JSON.stringify(state),
      })
      const res = await r.json()
      if (!res.ok) {
        status.className = 'status err'
        status.innerHTML = `<ul>${(res.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ul>${esc(res.error || 'Something went wrong.')}`
      } else {
        status.innerHTML = `<ul>${res.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`
        show(res.markdown)
      }
    } catch (err) {
      status.className = 'status err'
      status.textContent = 'The Tekken app isn\'t answering. Is its window still open?'
    } finally {
      btn.disabled = false
    }
  })

  fetch('/api/review/latest').then(r => r.json()).then(r => show(r.markdown)).catch(() => {
    $('report').innerHTML = '<p class="empty">Open this page through the Tekken app (localhost:8787).</p>'
  })
</script>
</body>
</html>
