<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<!--
  Full-window off-stream scoreboard, served by the Tekken app (server.py):
    http://localhost:8787/scoreboard.html
  "Open Scoreboard.html" in the app folder opens it.

  Reads data/battles.js (every stored game) for the session, the log and lifetime
  records, overlay-data.js (the poller's live copy) to notice new games quickly,
  guides/manifest.js for guide links and /queue.md for queue positions.

  Options go after the address, e.g. scoreboard.html?modes=ranked,quick&min=12
    modes = which modes count: ranked (default), quick, player, group, or all
            (the Ranked / All modes buttons set this too, and it's remembered)
    min   = your games-per-session minimum (default 10)
    gap   = minutes of no games that start a new session (default 45, same as the overlay)
-->
<style>
  :root {
    --bg: #0d0d12; --panel: #16161e; --line: rgba(255,255,255,0.08); --line2: rgba(255,255,255,0.2);
    --text: #ececf2; --muted: #8a8aa3; --win: #3ddc84; --loss: #ff5a5a; --even: #ffc94d; --accent: #4a9eff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .page { height: 100%; display: grid; gap: 16px; padding: 18px 22px 22px;
          grid-template-columns: 1fr 340px; grid-template-rows: auto auto auto minmax(0, 1fr); }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  .bar h1 { font-size: 15px; margin: 0; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .bar .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  .bar .status.warn { color: var(--even); }
  .modes { display: flex; gap: 6px; }
  .modes button { font: inherit; font-size: 12px; padding: 3px 11px; border-radius: 999px; cursor: pointer;
                  background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .modes button.on { background: rgba(74,158,255,0.15); color: var(--text); border-color: rgba(74,158,255,0.45); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; min-height: 0; }
  .h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 8px;
       display: flex; justify-content: space-between; gap: 10px; }
  .w { color: var(--win); } .l { color: var(--loss); } .e { color: var(--even); } .m { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
          color: var(--muted); white-space: nowrap; margin-top: 4px; }
  a.chip.guide { color: var(--accent); border-color: rgba(74,158,255,0.45); }
  a.chip.guide:hover { background: rgba(74,158,255,0.15); }

  /* last game */
  .hero { grid-column: 1; display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; border-left: 4px solid var(--muted); }
  .hero.W { border-left-color: var(--win); } .hero.L { border-left-color: var(--loss); }
  .hero .res { font-size: 54px; font-weight: 800; line-height: 1; white-space: nowrap; }
  .hero .vs { font-size: 13px; color: var(--muted); min-width: 0; }
  .hero .vs b { display: block; font-size: 30px; color: var(--text); letter-spacing: 0.04em; text-transform: uppercase; }
  .hero .life { text-align: right; font-size: 13px; color: var(--muted); }
  .hero .life b { display: block; font-size: 24px; }

  /* session */
  .sess { grid-column: 1; display: grid; grid-template-columns: auto minmax(160px, 1fr) minmax(220px, 1.1fr); gap: 24px; align-items: center; }
  .big { font-size: 40px; font-weight: 800; white-space: nowrap; }
  .line { font-size: 13px; margin-top: 2px; }
  svg.trend { width: 100%; height: 64px; display: block; }
  .goal { display: flex; gap: 3px; align-items: center; height: 30px; }
  .goal i { flex: 1 1 0; max-width: 14px; min-width: 2px; height: 22px; border-radius: 3px; display: block; }
  .goal i.W { background: var(--win); } .goal i.L { background: var(--loss); }
  .goal i.x { border: 1px dashed var(--line2); }
  .goal .cut { flex: none; width: 2px; height: 30px; background: var(--even); margin: 0 3px; border-radius: 1px; }
  .goalnote { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* every match */
  .log { grid-column: 1; display: flex; flex-direction: column; }
  .scroll { overflow: auto; min-height: 0; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
       padding: 0 8px 6px; position: sticky; top: 0; background: var(--panel); }
  td { padding: 4px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
  tr.setstart td { border-top-color: var(--line2); }
  .pill { display: inline-block; width: 22px; text-align: center; font-weight: 800; border-radius: 4px; font-size: 12px; }
  .pill.W { background: rgba(61,220,132,0.16); color: var(--win); } .pill.L { background: rgba(255,90,90,0.16); color: var(--loss); }

  /* tonight's opponents */
  .side { grid-column: 2; grid-row: 2 / 5; display: flex; flex-direction: column; }
  .opp { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 13px; }
  .opp:first-child { border-top: 0; padding-top: 0; }
  .opp .n { font-weight: 700; font-size: 15px; }
  .opp .r { text-align: right; font-weight: 700; }
  .opp .sub { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

  @media (max-width: 960px) {
    .page { height: auto; grid-template-columns: 1fr; grid-template-rows: none; }
    .hero, .sess, .log, .side { grid-column: 1; grid-row: auto; }
    .hero { grid-template-columns: 1fr; gap: 10px; } .hero .life { text-align: left; }
    .sess { grid-template-columns: 1fr; }
    .scroll { max-height: 60vh; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <h1>Scoreboard</h1>
    <div class="modes" id="modes">
      <button data-modes="ranked">Ranked</button>
      <button data-modes="all">All modes</button>
    </div>
    <div class="status" id="status">Loading…</div>
  </div>
  <div class="card hero" id="hero"><div class="empty">Loading your games…</div></div>
  <div class="card sess" id="sess"></div>
  <div class="card log"><div class="h"><span id="logTitle">Every match</span><span>newest first</span></div>
    <div class="scroll" id="log"></div></div>
  <div class="card side"><div class="h"><span id="sideTitle">Opponents</span><span>session · lifetime</span></div>
    <div class="scroll" id="side"></div></div>
</div>

<script>
  const params = new URLSearchParams(location.search)
  const MIN = parseInt(params.get('min'), 10) || 10
  const GAP_MIN = parseInt(params.get('gap'), 10) || 45
  const ALL_MODES = ['ranked', 'quick', 'player', 'group']
  const STALE_SEC = 900          // overlay-data older than this: the poller has stopped

  // Mode choice: the address wins, then the last button pressed, then ranked
  // (quick match is played loosely to feed the collector, so it's left out by default).
  function readModes(text) {
    const t = String(text || '').toLowerCase()
    if (t === 'all') return ALL_MODES.slice()
    const m = t.split(',').map(s => s.trim()).filter(s => ALL_MODES.includes(s))
    return m.length ? m : null
  }
  let stored = null
  try { stored = localStorage.getItem('scoreboard-modes') } catch (e) {}
  let MODES = readModes(params.get('modes')) || readModes(stored) || ['ranked']

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  const pct = (w, n) => n ? Math.round(100 * w / n) + '%' : '–'
  const cls = (w, l) => w > l ? 'w' : w < l ? 'l' : 'e'
  const wins = gs => gs.filter(g => g.result === 'W').length
  const rec = gs => { const w = wins(gs); return `<span class="${cls(w, gs.length - w)} num">${w}–${gs.length - w}</span>` }
  const score = g => String(g.rounds || '').replace('-', '–')
  function ago(sec) {
    if (sec < 60) return 'just now'
    if (sec < 3600) return `${Math.round(sec / 60)} min ago`
    if (sec < 86400 * 2) return `${Math.round(sec / 3600)} h ago`
    return `${Math.round(sec / 86400)} days ago`
  }
  function duration(ms) {
    const m = Math.round(ms / 60000)
    return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`
  }

  // ── loading ───────────────────────────────────────────────────────────────
  // Plain <script src> loads (cache-busted), the same way the overlay and the
  // stage tracker read the app's data.
  function loadScript(src) {
    return new Promise(resolve => {
      const s = document.createElement('script')
      s.src = src + (src.includes('?') ? '&' : '?') + 't=' + Date.now()
      s.onload = () => { s.remove(); resolve(true) }
      s.onerror = () => { s.remove(); resolve(false) }
      document.body.appendChild(s)
    })
  }

  let QUEUE = []                    // characters waiting for a guide, in queue order
  async function loadQueue() {
    try {
      const r = await fetch('queue.md?t=' + Date.now())
      if (!r.ok) return
      const text = (await r.text()).split('## Queue')[1]?.split('\n##')[0] || ''
      QUEUE = [...text.matchAll(/^- ([A-Za-z0-9 .\-]+?)\s*(?:<!--|$)/gm)].map(m => m[1].trim())
    } catch (e) {}
  }

  let appUp = true, battlesLoaded = false
  async function loadBattles() {
    const ok = await loadScript('data/battles.js')
    if (ok) battlesLoaded = true
    return ok
  }
  const newestAt = list => (list || []).reduce((a, b) => (b.battle_at > a ? b.battle_at : a), '')

  // Every 10 s: the poller's live copy (tiny) says whether a new game exists;
  // only then is the full battle file (all games) loaded again.
  async function tick() {
    const live = await loadScript('overlay-data.js')
    appUp = live || await loadBattles()
    const liveNewest = live ? newestAt(window.OVERLAY_DATA?.battles) : ''
    if (live && liveNewest > newestAt(window.BATTLES)) await loadBattles()
    render()
  }
  async function slowTick() {       // guides, queue, and the battle file even if nothing seemed new
    await Promise.all([loadScript('guides/manifest.js'), loadQueue(), loadBattles()])
    render()
  }

  // ── what to show ──────────────────────────────────────────────────────────
  function compute() {
    const games = (window.BATTLES || [])
      .filter(g => MODES.includes(String(g.mode).toLowerCase()))
      .map(g => ({ ...g, t: new Date(g.battle_at).getTime() }))
      .filter(g => !isNaN(g.t))
      .sort((a, b) => a.t - b.t)
    if (!games.length) return null
    const gap = GAP_MIN * 60000
    let i = games.length - 1
    while (i > 0 && games[i].t - games[i - 1].t < gap) i--
    const latest = games[games.length - 1]
    const char = latest.my_char
    const all = games.slice(i)                                   // whole session, every character
    const session = all.filter(g => g.my_char === char)          // the character you're on
    const live = Date.now() - latest.t < gap
    const lifetime = opp => games.filter(g => g.my_char === char && g.opp_char === opp)
    return { games, all, session, latest, char, live, lifetime }
  }

  function resource(opp) {
    const guide = (window.GUIDES || []).find(g => g.character === opp)
    if (guide) return `<a class="chip guide" href="${esc(guide.file)}" target="_blank" rel="noopener">Anti-${esc(opp)} guide ↗</a>`
    const have = new Set((window.GUIDES || []).map(g => g.character))
    const waiting = QUEUE.filter(c => !have.has(c))
    const n = waiting.indexOf(opp)
    if (n >= 0) return `<span class="chip">No guide · Queue #${n + 1}</span>`
    return QUEUE.length ? `<span class="chip">No guide · not queued</span>` : `<span class="chip">No guide yet</span>`
  }

  function lifeLine(d, opp) {
    const gs = d.lifetime(opp), w = wins(gs)
    return `${rec(gs)} <span class="m">${pct(w, gs.length)}</span>`
  }

  function trend(games) {
    let y = 0
    const pts = [[0, 0]]
    games.forEach((g, i) => { y += g.result === 'W' ? 1 : -1; pts.push([i + 1, y]) })
    const ys = pts.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), w = 600, h = 64
    const X = i => i / Math.max(1, games.length) * w, Y = v => 6 + (hi - v) / (hi - lo || 1) * (h - 12)
    return {
      now: y, best: hi,
      svg: `<svg class="trend" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <line x1="0" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
        <polyline fill="none" stroke="#4a9eff" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/></svg>`
    }
  }
  const signed = n => (n > 0 ? '+' : '') + n

  // ── drawing ───────────────────────────────────────────────────────────────
  function render() {
    document.querySelectorAll('#modes button').forEach(b => {
      const m = readModes(b.dataset.modes)
      b.classList.toggle('on', m.length === MODES.length && m.every(x => MODES.includes(x)))
    })
    const modeLabel = MODES.length === ALL_MODES.length ? 'all modes' : MODES.join(' + ')
    renderStatus()

    const d = battlesLoaded ? compute() : null
    if (!d) {
      document.getElementById('hero').className = 'card hero'
      document.getElementById('hero').innerHTML = `<div class="empty">${battlesLoaded ? `No ${esc(modeLabel)} games stored yet.` : 'Waiting for the Tekken app…'}</div>`
      ;['sess', 'log', 'side'].forEach(id => document.getElementById(id).innerHTML = '')
      return
    }
    const { session, latest, char, live } = d
    const ageSec = (Date.now() - latest.t) / 1000

    // last game
    let set = []
    for (let i = session.length - 1; i >= 0 && session[i].opp_char === latest.opp_char && session[i].opp_rank === latest.opp_rank; i--) set.unshift(session[i])
    const vsSession = session.filter(g => g.opp_char === latest.opp_char)
    const hero = document.getElementById('hero')
    hero.className = `card hero ${latest.result}`
    hero.innerHTML = `
      <div class="res ${latest.result === 'W' ? 'w' : 'l'}">${latest.result} ${esc(score(latest))}</div>
      <div class="vs">${live ? '' : 'Last game · '}${ago(ageSec)}${latest.stage ? ' · ' + esc(latest.stage) : ''}${latest.opp_rank ? ' · ' + esc(latest.opp_rank) : ''}
        <b>vs ${esc(latest.opp_char)}</b>This set ${rec(set)} · this session vs ${esc(latest.opp_char)} ${rec(vsSession)}</div>
      <div class="life">Lifetime vs ${esc(latest.opp_char)} (${esc(modeLabel)}, ${esc(char)})<b>${lifeLine(d, latest.opp_char)}</b>${resource(latest.opp_char)}</div>`

    // session
    const n = session.length, w = wins(session)
    const first = session.slice(0, MIN), after = session.slice(MIN)
    const tr = trend(session)
    const cutAt = Math.max(n, MIN)
    let ticks = ''
    for (let i = 0; i < cutAt; i++) {
      if (i === MIN) ticks += `<span class="cut" title="Your ${MIN}-game minimum"></span>`
      ticks += i < n ? `<i class="${session[i].result}"></i>` : '<i class="x"></i>'
    }
    if (n <= MIN) ticks += `<span class="cut" title="Your ${MIN}-game minimum"></span>`
    const minLine = n >= MIN
      ? `<span class="w">${MIN} minimum ✓</span> <span class="m">(+${n - MIN})</span>`
      : `<span class="m">${MIN - n} to your ${MIN} minimum</span>`
    const others = d.all.length !== n
      ? `<div class="line m">All characters ${rec(d.all)}</div>` : ''
    document.getElementById('sess').innerHTML = `
      <div><div class="h"><span>${live ? 'Session' : 'Last session'} · ${esc(modeLabel)}</span></div>
        <div class="big num"><span class="w">${w}W</span><span class="m"> – </span><span class="l">${n - w}L</span></div>
        <div class="line m">${pct(w, n)} · ${duration(latest.t - session[0].t)} · game ${n}</div>
        <div class="line">${minLine}</div>${others}</div>
      <div><div class="h"><span>Running record</span><span>${signed(tr.now)} now · best ${signed(tr.best)}</span></div>${tr.svg}</div>
      <div><div class="h"><span>Games vs your ${MIN} minimum</span>${n >= MIN ? `<span class="w">✓ +${n - MIN}</span>` : ''}</div>
        <div class="goal">${ticks}</div>
        <div class="goalnote"><span>first ${Math.min(n, MIN)}: ${rec(first)}</span>${after.length ? `<span>after: ${rec(after)}</span>` : ''}</div></div>`

    // every match, newest first, with a brighter line between sets
    document.getElementById('logTitle').textContent = live ? 'Every match this session' : 'Every match last session'
    const rows = session.map((g, i) => ({ g, i })).reverse().map(({ g, i }) => {
      const newer = session[i + 1]                   // the row drawn just above this one
      const newSet = newer && (newer.opp_char !== g.opp_char || newer.opp_rank !== g.opp_rank)
      return `<tr${newSet ? ' class="setstart"' : ''}><td class="m num">${i + 1}</td><td><span class="pill ${g.result}">${g.result}</span></td>
        <td class="num">${esc(score(g))}</td><td>${esc(g.opp_char)}</td><td class="m">${esc(g.opp_rank || '')}</td><td class="m">${esc(g.stage || '')}</td></tr>`
    })
    document.getElementById('log').innerHTML = `<table><tr><th>#</th><th></th><th>Score</th><th>Opponent</th><th>Rank</th><th>Stage</th></tr>${rows.join('')}</table>`

    // opponents this session, most played first
    document.getElementById('sideTitle').textContent = live ? "Tonight's opponents" : "Last session's opponents"
    const opps = [...new Set(session.map(g => g.opp_char))]
      .map(o => ({ o, gs: session.filter(g => g.opp_char === o) }))
      .sort((a, b) => b.gs.length - a.gs.length || a.o.localeCompare(b.o))
    document.getElementById('side').innerHTML = opps.map(({ o, gs }) => `
      <div class="opp"><span class="n">${esc(o)}</span><span class="r num">${rec(gs)}</span>
        <span class="sub">Lifetime ${lifeLine(d, o)}</span>
        <span class="sub">${resource(o)}</span></div>`).join('')
  }

  function renderStatus() {
    const st = document.getElementById('status')
    const data = window.OVERLAY_DATA
    let text = '', warn = false
    if (!appUp) { text = 'Tekken app not running · start it with Start Tekken App.bat'; warn = true }
    else if (!data) text = 'Poller off · showing saved games'
    else {
      const age = (Date.now() - new Date(data.updated).getTime()) / 1000
      const paused = data.paused_until ? new Date(data.paused_until) : null
      if (data.error === 'rate_limited' && paused && paused > Date.now()) {
        text = `Hourly ewgf.gg limit reached · back at ${paused.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`; warn = true
      } else if (data.error && data.error !== 'rate_limited') { text = `ewgf.gg not responding, retrying`; warn = true }
      else if (age > STALE_SEC) { text = 'Not updating · is the Tekken app running?'; warn = true }
      else text = `Live · checked ${age < 60 ? Math.max(0, Math.round(age)) + 's' : Math.round(age / 60) + ' min'} ago`
    }
    st.textContent = text
    st.className = 'status' + (warn ? ' warn' : '')
  }

  document.getElementById('modes').addEventListener('click', e => {
    const b = e.target.closest('button')
    if (!b) return
    MODES = readModes(b.dataset.modes)
    try { localStorage.setItem('scoreboard-modes', b.dataset.modes) } catch (e) {}
    render()
  })

  slowTick().then(tick)
  setInterval(tick, 10000)
  setInterval(slowTick, 300000)
</script>
</body>
</html>
