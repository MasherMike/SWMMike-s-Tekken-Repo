# End-of-session review. Run it when you finish playing:
#   GitHub app or website -> this repo -> Actions -> "End session" -> Run workflow.
# It pulls your newest battles, writes reviews/LATEST.md, and shows the same
# report on the run's summary page.

name: End session

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to review"
        type: choice
        options:
          - last session
          - today
          - yesterday
          - last 7 days
          - last 14 days
          - last 30 days
        default: last session
      mode:
        description: "Which games count (ranked = coaching default; quick match is for feeding data)"
        type: choice
        options:
          - ranked
          - quick
          - ranked,quick
          - all
        default: ranked

permissions:
  contents: write

concurrency:
  group: battle-data          # shared with the collector so they never write at once
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull newest battles
        env:
          EWGF_API_KEY: ${{ secrets.EWGF_API_KEY }}
        run: python scripts/collect_battles.py

      - name: Write the review
        env:
          SCOPE: ${{ inputs.scope }}
          MODE: ${{ inputs.mode }}
        run: python scripts/session_review.py

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/battles.jsonl data/battles.js data/battles.csv reviews
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "review: ${{ inputs.scope }} (${{ inputs.mode }})"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected, rebasing on the newest commit and retrying ($attempt)"
            git pull --rebase origin main
          done
          exit 1
