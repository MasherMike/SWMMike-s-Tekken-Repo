# Pulls Mike's latest battles from ewgf.gg every hour into data/battles.jsonl.
# Stores only: date, mode, my character, opponent character, opponent rank,
# result + round score, stage. Never names, IDs, regions or Tekken Power.
# Can also be started by hand: Actions tab -> "Collect battles" -> Run workflow.

name: Collect battles

on:
  schedule:
    - cron: "17 * * * *"       # hourly at :17 (EWGF Pro has no delay; GitHub sometimes skips a run)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: battle-data          # shared with End session so they never write at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull new battles
        env:
          EWGF_API_KEY: ${{ secrets.EWGF_API_KEY }}
        run: python scripts/collect_battles.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/battles.jsonl data/battles.js data/battles.csv
          if git diff --cached --quiet; then echo "No new battles."; exit 0; fi
          git commit -m "data: collect battles"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected, rebasing on the newest commit and retrying ($attempt)"
            git pull --rebase origin main
          done
          exit 1
