# Adds Wavu Wank skill ratings (yours and your opponent's, before each game) to
# stored ranked games. 3 requests a day to your own public player page.
# Never stores names or IDs. Can also be run by hand: Actions -> "Collect ratings".

name: Collect ratings

on:
  schedule:
    - cron: "0 0,8,16 * * *"   # midnight, 8 AM, 4 PM
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: battle-data          # shared with the other collectors so they never write at once
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Add ratings from Wavu Wank
        run: python scripts/collect_wank.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/battles.jsonl data/battles.js data/battles.csv
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "data: ratings from Wavu Wank"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected, rebasing on the newest commit and retrying ($attempt)"
            git pull --rebase origin main
          done
          exit 1
