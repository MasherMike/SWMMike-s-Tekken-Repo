<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tekken overlay (moved)</title>
<!--
  RETIRED (Oct 18, 2026). The overlay now runs inside the Tekken app:
      http://localhost:8787/overlay.html            full panel
      http://localhost:8787/overlay.html?layout=strip&anchor=bottom&scale=1.25   Twitch strip
  This file only forwards there, keeping any options you typed after "overlay.html?".
  The old poller (start-overlay.bat / poller.ps1) is retired: it would split the
  hourly ewgf.gg request limit with the app.
-->
<style>
  html, body { margin: 0; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
  .panel { width: 340px; box-sizing: border-box; background: rgba(12,12,18,.86); color: #ececf2;
           border: 1px solid rgba(255,255,255,.08); border-left: 3px solid #ffc94d; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.45; }
  b { color: #fff; } .muted { color: #8a8aa3; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div class="panel" id="msg">
  <b>This overlay moved into the Tekken app.</b><br>
  Checking whether the app is running…
</div>
<script>
  const APP = 'http://localhost:8787/overlay.html' + location.search + location.hash
  const msg = document.getElementById('msg')
  // Ask the app for its live data; if it answers, go to the real overlay.
  function probe() {
    const s = document.createElement('script')
    s.src = 'http://localhost:8787/overlay-data.js?t=' + Date.now()
    s.onload = () => location.replace(APP)
    s.onerror = () => {
      s.remove()
      msg.innerHTML = '<b>Tekken app not running.</b><br>Start it with <b>Start Tekken App.bat</b> in D:\\SW-T8\\app. ' +
        'This page opens the overlay by itself once the app is up.' +
        '<div class="muted">Old poller retired: don\'t run start-overlay.bat.</div>'
    }
    document.body.appendChild(s)
  }
  probe()
  setInterval(probe, 5000)
</script>
</body>
</html>
